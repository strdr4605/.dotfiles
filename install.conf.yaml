- defaults:
    link:
      relink: true
      force: true
      create: true

- clean: ["~"]

- link:
    ~/.tmux.conf: .tmux.conf
    ~/.alacritty.toml: .alacritty.toml
    ~/.config/nvim: ./nvim
    ~/.zshrc: .zshrc
    ~/.config/starship.toml: starship.toml
    ~/.gitconfig: .gitconfig
    ~/.config/jj/config.toml: .jjconfig.toml
    ~/.config/opencode: opencode
    ~/.pi: pi
    ~/.config/ponytail: ponytail
    ~/AGENTS.md: agents/AGENTS.md
    ~/.claude/CLAUDE.md: claude/CLAUDE.md
    ~/.claude/RTK.md: claude/RTK.md
    ~/.config/herdr/config.toml: herdr.toml
    ~/.local/bin/planck-agent: planck-agent/bin/planck-agent
    ~/.config/planck-agent/config.json: planck-agent/config.json
    ~/.config/skhd/skhdrc: planck-agent/skhdrc
    ~/Library/LaunchAgents/planck-agent.plist: planck-agent/planck-agent.plist


- shell:
    - [git submodule update --init --recursive, Installing submodules]
    - command: ./brew.sh
      description: Brew
    - command: command -v kontroll || cargo install kontroll
      description: Kontroll
    - command: launchctl bootstrap gui/$UID ~/Library/LaunchAgents/planck-agent.plist 2>/dev/null || true
      description: Planck LED daemon
    - command: skhd --start-service 2>/dev/null || true
      description: skhd (needs Accessibility; skip on MDM, use Raycast)
      stdout: true
    - command: sh -c "$(curl -fsSL https://raw.github.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" || true
      description: Installing Oh My Zsh
      stdout: true
    - command: curl https://raw.githubusercontent.com/strdr4605/tt/latest/tt.sh > ~/tt.sh
      description: Installing tt
    - command: ./check_tmux_tpm.sh
      description: Tmux Plugin Manager
      allow_fail: true
    - command: ./pi/install.sh
      description: Pi packages
