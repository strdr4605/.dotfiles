"$schema" = "https://jj-vcs.github.io/jj/latest/config-schema.json"

[user]
name = "Dragoș Străinu"
email = "str.dr4605@gmail.com"

[ui]
default-command = "log"

# disable pagination for `jj status`, use `delta` for `jj diff` and `jj show`
[[--scope]]
when.commands = ["status"]
# [--scope.ui]
# paginate = "never"
[[--scope]]
when.commands = ["diff", "show"]
[--scope.ui]
pager = "delta"


# `jj start [message]`: fetch (prunes deleted remote bookmarks), then new change on trunk.
# No bookmark here; create it at push time with `jj git push -c @`.
[aliases]
start = ["util", "exec", "--", "sh", "-c", '''
set -e
jj git fetch
jj new 'trunk()' ${1:+-m "$1"}
''', "jj-start"]
